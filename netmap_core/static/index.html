<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NetMap</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
  integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
  crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1><svg class="logo" viewBox="0 0 140 44" role="img" aria-label="NetMap">
        <defs><linearGradient id="nmGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#5aa0f0"/><stop offset="1" stop-color="#9085e9"/>
        </linearGradient></defs>
        <text x="1" y="27" textLength="104" lengthAdjust="spacingAndGlyphs"
          font-size="23" font-weight="700" letter-spacing=".2"
          font-family="Segoe UI,system-ui,-apple-system,sans-serif"
          fill="#ffffff">Net<tspan fill="url(#nmGrad)">Map</tspan></text>
        <path d="M1 36 H106 C114 36 116 33 119 28 L124 18" fill="none"
          stroke="url(#nmGrad)" stroke-width="2" stroke-linecap="round" stroke-opacity=".9"/>
        <circle cx="28" cy="36" r="2.7" fill="url(#nmGrad)"/>
        <circle cx="70" cy="36" r="2.7" fill="url(#nmGrad)"/>
        <circle class="lblip" cx="125.5" cy="14.5" r="4.2" fill="#e2564f"/>
      </svg></h1>
      <small class="tag" id="tagline">This machine. Every connection. One map.</small>
    </div>
    <span id="ver" title="running build">v–</span>
    <div class="seg" role="tablist" aria-label="What to show">
      <button id="scopeLocal" class="on" role="tab">This machine</button>
      <button id="scopeNetwork" role="tab">Network</button>
    </div>
    <span class="pill" id="geoPill"><span class="led"></span><span id="geoTxt">geo</span></span>
    <span class="pill" id="threatPill" hidden><span class="led"></span><span id="threatTxt"></span></span>
    <span class="pill" id="routerPill" hidden><span class="led"></span><span id="routerTxt"></span></span>
    <span class="pill" id="tsPill" hidden><span class="led"></span><span id="tsTxt"></span></span>
    <div class="tiles">
      <div class="tile"><b id="tActive">–</b><small>active conns</small></div>
      <div class="tile"><b id="tHosts">–</b><small>remote hosts</small></div>
      <div class="tile flagged" id="tileFlagged" title="Remote hosts with a blocklist, rule or verdict flag"><b id="tFlagged">–</b><small>flagged</small></div>
      <div class="tile"><b id="tCountries">–</b><small>countries</small></div>
      <div class="tile"><b id="tExtra">–</b><small id="tExtraLbl">↓ / ↑ rate</small></div>
      <button class="hbtn" id="settingsBtn" title="Settings">&#9881; settings</button>
      <button class="hbtn" id="logoutBtn" hidden>log out</button>
      <button class="hbtn" id="quitBtn" hidden title="Stop NetMap">&#10005; quit</button>
    </div>
  </header>
  <main>
    <div id="mapWrap">
      <div id="map"></div>
      <div id="banner" hidden></div>
      <div id="timeline">
        <button class="btn" id="liveBtn" title="Back to live"><span class="led"></span>Live</button>
        <select id="tRange" title="How far back the slider reaches">
          <option value="3600">1 hour</option><option value="86400" selected>24 hours</option>
          <option value="604800">7 days</option><option value="2592000">30 days</option>
          <option value="31536000">1 year</option>
        </select>
        <button class="btn" id="playBtn" title="Replay forward">&#9654;</button>
        <input type="range" id="tSlider" min="0" max="1000" value="1000" aria-label="Time">
        <span id="tLabel">live</span>
      </div>
    </div>
    <aside>
      <div class="tabs" role="tablist">
        <button id="tabLive" class="on" role="tab">Live</button>
        <button id="tabHist" role="tab">History</button>
      </div>
      <div class="filter">
        <input id="q" type="search" placeholder="Filter by device, process, IP, domain, country…" autocomplete="off">
        <div class="chips" id="chips"></div>
      </div>
      <div id="list"><div class="empty">Waiting for data…</div></div>
    </aside>
  </main>
</div>

<div class="overlay" id="settings" hidden>
  <div class="drawer">
    <nav id="setNav">
      <b>Settings</b>
      <button data-pane="router">Router</button>
      <button data-pane="subnets">Subnets</button>
      <button data-pane="devices">Devices</button>
      <button data-pane="rules">Rules</button>
      <button data-pane="verdicts">Verdicts</button>
      <button data-pane="threats">Threat lists</button>
      <button data-pane="account">Account &amp; storage</button>
    </nav>
    <div class="pane"><button class="btn close" id="setClose">close</button><div id="paneBody"></div></div>
  </div>
</div>

<div class="overlay" id="loginOverlay" hidden>
  <form class="login" id="loginForm">
    <h2 id="loginTitle">NetMap</h2>
    <p class="help" id="loginHelp"></p>
    <input class="in" id="setupCode" placeholder="setup code from the log" autocomplete="off" hidden>
    <input class="in" id="pw1" type="password" placeholder="password" autocomplete="current-password">
    <input class="in" id="pw2" type="password" placeholder="repeat password" autocomplete="new-password" hidden>
    <div id="loginMsg"></div>
    <button class="btn primary" id="loginBtn" type="submit">Log in</button>
  </form>
</div>

<div id="stopped" hidden><div><b>NetMap stopped</b>You can close this tab.</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
  integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=="
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="/static/app.js"></script>
</body>
</html>
